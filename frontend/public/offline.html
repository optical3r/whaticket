<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sem conexão</title>
    <style>
      :root {
        --bg-primary: #f3f6fa;
        --bg-surface: #ffffff;
        --border-subtle: #e8ecf2;
        --text-primary: #111827;
        --text-secondary: #526176;
        --action-primary: #2a68de;
        --on-action: #ffffff;
        --focus-ring: #17889a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-primary: #070b12;
          --bg-surface: #111827;
          --border-subtle: #253044;
          --text-primary: #f3f6fa;
          --text-secondary: #96a3b5;
          --focus-ring: #35c2d6;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font: 16px/1.55 "Inter", "Helvetica", "Arial", sans-serif;
      }
      main {
        max-width: 420px;
        padding: 24px;
        border: 1px solid var(--border-subtle);
        border-radius: 16px;
        background: var(--bg-surface);
        text-align: center;
      }
      h1 { margin: 16px 0 8px; font: 600 22px/1.3 "Sora", "Inter", sans-serif; }
      p { margin: 0 0 24px; color: var(--text-secondary); }
      button {
        min-height: 44px;
        padding: 0 24px;
        border: 0;
        border-radius: 10px;
        background: var(--action-primary);
        color: var(--on-action);
        font: 600 14px "Inter", sans-serif;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" width="48" height="48" />
      <h1>Sem conexão com a internet</h1>
      <p>Verifique a sua conexão. Assim que ela voltar, o atendimento continua de onde parou.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
